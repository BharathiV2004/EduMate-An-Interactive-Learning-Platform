<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMapper</title>
    <link rel="stylesheet" href="/static/css/map.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button id="toggle-sidebar" class="icon-button">
                    <i data-lucide="menu"></i>
                </button>
                <h1>MindMapper</h1>
                <input type="text" id="mindmap-name" value="New Mind Map" class="map-name-input">
            </div>
            <div class="header-right">
                <div class="search-container">
                    <i data-lucide="search"></i>
                    <input type="text" id="search-nodes" placeholder="Search nodes..." class="search-input">
                </div>
                <button id="toggle-darkmode" class="icon-button">
                    <i data-lucide="moon"></i>
                </button>
            </div>
        </header>

        <div class="main-content">
            <!-- Sidebar -->
            <aside id="sidebar" class="sidebar">
                <div class="sidebar-section">
                    <h3>Tools</h3>
                    <div class="tool-buttons">
                        <button data-tool="select" class="tool-button active">
                            <i data-lucide="move"></i> Select
                        </button>
                        <button data-tool="add" class="tool-button">
                            <i data-lucide="plus"></i> Add Node
                        </button>
                        <button data-tool="connect" class="tool-button">
                            <i data-lucide="type"></i> Connect
                        </button>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>Create Mind Map</h3>
                    <input type="text" id="central-topic" placeholder="Enter central topic..." class="text-input">
                    <button id="create-central" class="primary-button">Create Central Node</button>
                    <button id="show-templates" class="secondary-button">Use Template</button>
                    <div id="templates-container" class="templates-container hidden">
                        <!-- Templates will be loaded here -->
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3><i data-lucide="lightbulb"></i> AI Suggestions</h3>
                    <button id="ai-suggest" class="ai-button" disabled>
                        <span id="ai-text">Expand Topic</span>
                        <span id="ai-loading" class="hidden">Generating...</span>
                    </button>
                </div>

                <div class="sidebar-section">
                    <h3>Actions</h3>
                    <button id="zoom-in" class="action-button">
                        <i data-lucide="zoom-in"></i> Zoom In
                    </button>
                    <button id="zoom-out" class="action-button">
                        <i data-lucide="zoom-out"></i> Zoom Out
                    </button>
                    <button id="delete-selected" class="action-button danger" disabled>
                        <i data-lucide="trash-2"></i> Delete Selected
                    </button>
                </div>

                <div id="node-properties" class="sidebar-section properties-panel hidden">
                    <h3>Node Properties</h3>
                    <div class="property-group">
                        <label>Color</label>
                        <div class="color-palette">
                            <button data-color="#3b82f6" style="background-color: #3b82f6;"></button>
                            <button data-color="#10b981" style="background-color: #10b981;"></button>
                            <button data-color="#f59e0b" style="background-color: #f59e0b;"></button>
                            <button data-color="#ef4444" style="background-color: #ef4444;"></button>
                            <button data-color="#8b5cf6" style="background-color: #8b5cf6;"></button>
                        </div>
                    </div>
                    <div class="property-group">
                        <label>Size</label>
                        <select id="node-size" class="property-select">
                            <option value="small">Small</option>
                            <option value="medium" selected>Medium</option>
                            <option value="large">Large</option>
                        </select>
                    </div>
                </div>
            </aside>

            <!-- Canvas -->
            <main class="canvas-container">
                <div id="canvas" class="canvas">
                    <svg id="connections" class="connections-layer"></svg>
                    <div id="nodes-container" class="nodes-container"></div>
                    <div id="empty-state" class="empty-state">
                        <h2>Welcome to MindMapper</h2>
                        <p>Enter a central topic in the sidebar to get started</p>
                        <div class="empty-box">
                            <i data-lucide="plus"></i>
                        </div>
                    </div>
                </div>

                <div class="canvas-controls">
                    <div class="zoom-controls">
                        <button id="zoom-in-btn"><i data-lucide="zoom-in"></i></button>
                        <button id="zoom-out-btn"><i data-lucide="zoom-out"></i></button>
                        <span id="zoom-level">100%</span>
                    </div>
                    <div class="minimap">
                        <div class="minimap-header">
                            <i data-lucide="map"></i> Mini Map
                        </div>
                        <div id="minimap-view" class="minimap-view"></div>
                    </div>
                </div>

                <div class="status-bar">
                    <span>Nodes: <span id="node-count">0</span></span>
                    <span>Selected: <span id="selected-count">0</span></span>
                    <span id="ai-status" class="hidden"><i data-lucide="loader" class="spin"></i> AI Generating...</span>
                </div>
            </main>
        </div>
    </div>

    <script src="/static/js/map.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
