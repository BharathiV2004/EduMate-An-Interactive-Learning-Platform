<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ topic }} Matching Game</title>
    <link rel="stylesheet" href="/static/css/style_flip.css">
    <style>
        /* Temporary inline styles for critical elements */
        .hidden { display: none !important; }
        .completion-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-header">
            <h1>{{ topic }} Matching Game</h1>
            <div class="game-meta">
                <div class="game-stats">
                    <div class="stat">
                        <span class="stat-label">Matches:</span>
                        <span id="matches">0</span>/<span id="total-pairs">{{ total_pairs }}</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Time:</span>
                        <span id="timer">00:00</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Moves:</span>
                        <span id="moves">0</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Score:</span>
                        <span id="score">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="game-board" class="game-board">
            {% for card in cards %}
            <div class="card" 
                 data-id="{{ card.id }}" 
                 data-match-id="{{ card.match_id }}">
                <div class="card-face card-front">?</div>
                <div class="card-face card-back">{{ card.content }}</div>
            </div>
            {% endfor %}
        </div>

        <div class="game-controls">
            <button id="restart-btn" class="btn">Restart Game</button>
        </div>
    </div>

    <!-- Game Completion Overlay -->
    <div id="game-completion" class="completion-overlay hidden">
        <div class="completion-content">
            <div class="confetti"></div>
            <div class="confetti"></div>
            <div class="confetti"></div>
            <h2>🎉 Game Completed! 🎉</h2>
            <div class="game-stats">
                <div class="stat">
                    <span class="stat-label">Matches:</span>
                    <span class="stat-value">0</span>/<span class="stat-value">10</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Time:</span>
                    <span class="stat-value">00:00</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Moves:</span>
                    <span class="stat-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Score:</span>
                    <span class="stat-value">0</span>
                </div>
            </div>
            <div class="completion-buttons">
                <button id="restart-game" class="btn highlight">Play Again</button>
            </div>
        </div>
    </div>

    <script src="/static/js/singleplayer_flip.js"></script>
</body>
</html>
