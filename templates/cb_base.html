<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Blocks Puzzle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cb_style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* style.css - LeetCode-inspired theme */

:root {
  --primary-color: #0a0a1a;
  --secondary-color: #12122b;
  --accent-color: #00f2fe;
  --accent-secondary: #4facfe;
  --text-color: #e8e8e8;
  --text-secondary: #b3b3b3;
  --success-color: #00ff9d;
  --error-color: #ff3a5e;
  --code-bg: #1e1e3d;
  --header-height: 50px;
  --sidebar-width: 250px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Roboto', sans-serif;
  background-color: var(--primary-color);
  color: var(--text-color);
  line-height: 1.6;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
}

/* Header styling - LeetCode-like */
header {
  background-color: var(--secondary-color);
  height: var(--header-height);
  border-bottom: 1px solid #333;
  position: sticky;
  top: 0;
  z-index: 100;
}

header .container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 100%;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 20px;
}

header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--accent-color);
  text-shadow: 0 0 5px rgba(0, 242, 254, 0.5);
  margin: 0;
}

header h1 a {
  color: inherit;
  text-decoration: none;
}

header nav ul {
  display: flex;
  list-style: none;
  align-items: center;
  gap: 20px;
  margin: 0;
  padding: 0;
}

header nav ul li a {
  color: var(--text-color);
  text-decoration: none;
  font-size: 0.9rem;
  transition: color 0.2s;
}

header nav ul li a:hover {
  color: var(--accent-color);
}

.coins {
  color: var(--accent-color);
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 5px;
}

/* Back button style */
.back-btn {
  background-color: transparent;
  color: var(--text-color);
  border: 1px solid var(--accent-color);
  padding: 5px 15px;
  border-radius: 5px;
  text-decoration: none;
  font-size: 0.9rem;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 5px;
}

.back-btn:hover {
  background-color: var(--accent-color);
  color: var(--primary-color);
  box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
}

.back-btn::before {
  content: "←";
}

/* Main content area */
main {
  min-height: calc(100vh - var(--header-height));
  padding: 20px 0;
}

/* Welcome banner */
.welcome-banner {
  background-color: var(--secondary-color);
  padding: 20px;
  border-radius: 5px;
  margin-bottom: 30px;
  border-left: 4px solid var(--accent-color);
}

.welcome-banner h2 {
  color: var(--accent-color);
  margin-bottom: 10px;
}

.progress-container {
  background-color: #333;
  height: 25px;
  border-radius: 12px;
  margin-top: 15px;
  position: relative;
  overflow: hidden;
}

.progress-bar {
  background-color: var(--accent-color);
  height: 100%;
  transition: width 0.3s;
}

.progress-container span {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 0.8rem;
  color: white;
  z-index: 1;
}

/* Level grid */
.level-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}

.level-card {
  background-color: var(--secondary-color);
  border-radius: 5px;
  padding: 15px;
  text-decoration: none;
  color: var(--text-color);
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
  overflow: hidden;
  border-left: 3px solid transparent;
  transition: all 0.3s ease;
}

.level-card:hover {
  border-left-color: var(--accent-color);
  box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
}

.level-card.locked {
  opacity: 0.6;
  pointer-events: none;
}

.level-card.locked::after {
  content: "🔒";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 2rem;
}

.level-number {
  font-size: 0.8rem;
  color: var(--text-secondary);
  margin-bottom: 5px;
}

.level-card h3 {
  color: var(--accent-color);
  margin-bottom: 10px;
  font-size: 1.1rem;
}

.level-reward {
  font-size: 0.8rem;
  color: var(--text-secondary);
}

.completed-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background-color: var(--success-color);
  color: white;
  font-size: 0.7rem;
  padding: 3px 8px;
  border-radius: 10px;
}

/* Level page styling */
.level-container {
  background-color: var(--secondary-color);
  border-radius: 5px;
  padding: 20px;
  margin-bottom: 30px;
}

.level-container h2 {
  color: var(--accent-color);
  margin-bottom: 10px;
  font-size: 1.5rem;
}

.game-area {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 20px;
}

@media (max-width: 768px) {
  .game-area {
    grid-template-columns: 1fr;
  }
}

.blocks-pool, .workspace, .output {
  background-color: var(--code-bg);
  border-radius: 5px;
  padding: 15px;
}

.blocks-pool h3, .workspace h3, .output h3 {
  font-size: 1rem;
  margin-bottom: 10px;
  color: var(--accent-color);
  border-bottom: 1px solid #444;
  padding-bottom: 5px;
}

.code-block {
  background-color: #3a3a3a;
  padding: 8px 12px;
  margin: 5px 0;
  border-radius: 3px;
  cursor: move;
  font-family: 'Roboto Mono', monospace;
  font-size: 0.9rem;
  border-left: 3px solid var(--accent-color);
  box-shadow: 0 0 10px rgba(0, 242, 254, 0.1);
  transition: background-color 0.2s;
}

.code-block:hover {
  background-color: #444;
}

.drop-zone {
  min-height: 150px;
  border: 2px dashed #555;
  border-radius: 5px;
  padding: 10px;
  margin-bottom: 15px;
}

.drop-zone.drag-over {
  border-color: var(--accent-color);
  background-color: rgba(255, 161, 22, 0.1);
}

button {
  background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
  color: #0a0a1a;
  border: none;
  padding: 8px 15px;
  border-radius: 3px;
  cursor: pointer;
  font-weight: bold;
  transition: background-color 0.2s;
  margin-right: 10px;
}

button:hover {
  background: linear-gradient(135deg, #00d9e6, #3d9dfe);
}

button:disabled {
  background-color: #666;
  cursor: not-allowed;
}

#hint-btn {
  background-color: #555;
  color: rgb(0, 0, 0);
}

#hint-btn:hover {
  background-color: #666;
}

.output pre {
  background-color: #252525;
  padding: 10px;
  border-radius: 3px;
  overflow-x: auto;
  font-family: 'Roboto Mono', monospace;
}

#result-message {
  margin-top: 15px;
  padding: 10px;
  border-radius: 3px;
}

.success {
  color: var(--success-color);
  background-color: rgba(92, 184, 92, 0.1);
  padding: 10px;
  border-radius: 3px;
  color: var(--success-color);
  text-shadow: 0 0 5px rgba(0, 255, 157, 0.3);
}

.error {
  color: var(--error-color);
  background-color: rgba(217, 83, 79, 0.1);
  padding: 10px;
  border-radius: 3px;
  color: var(--error-color);
  text-shadow: 0 0 5px rgba(255, 58, 94, 0.3);
}

/* Profile page */
.profile-header {
  display: flex;
  align-items: center;
  gap: 30px;
  margin-bottom: 30px;
  background-color: var(--secondary-color);
  padding: 20px;
  border-radius: 5px;
}

.avatar-container {
  display: flex;
  align-items: center;
  gap: 15px;
}

.avatar {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  font-weight: bold;
  color: white;
}

.stats-summary {
  display: flex;
  gap: 30px;
}

.stat {
  text-align: center;
}

.stat-value {
  font-size: 1.5rem;
  font-weight: bold;
  color: var(--accent-color);
}

.stat-label {
  font-size: 0.8rem;
  color: var(--text-secondary);
}

.profile-sections {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

@media (max-width: 768px) {
  .profile-sections {
    grid-template-columns: 1fr;
  }
}

.achievement-card {
  background-color: var(--secondary-color);
  padding: 15px;
  border-radius: 5px;
  margin-bottom: 15px;
  opacity: 0.5;
}

.achievement-card.unlocked {
  opacity: 1;
  border-left: 3px solid var(--accent-color);
}

.achievement-icon {
  font-size: 1.5rem;
  margin-bottom: 5px;
}

.empty-inventory {
  background-color: var(--secondary-color);
  padding: 20px;
  border-radius: 5px;
  text-align: center;
  color: var(--text-secondary);
}

/* Store page */
.store-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid #444;
}

.store-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.tab-btn {
  background-color: #333;
  color: #000000;
  border: none;
  padding: 8px 15px;
  border-radius: 3px;
  cursor: pointer;
}

.tab-btn.active {
  background-color: var(--accent-color);
  color: #1a1a1a;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 20px;
}

.store-item {
  background-color: var(--secondary-color);
  border-radius: 5px;
  padding: 15px;
  transition: transform 0.2s;
}

.store-item:hover {
  transform: translateY(-3px);
}

.item-preview {
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 15px;
  border-radius: 3px;
  background-color: #333;
}

.avatar-preview {
  font-size: 2rem;
  color: white;
}

.theme-preview {
  flex-direction: column;
  gap: 5px;
}

.theme-demo-code {
  font-family: 'Roboto Mono', monospace;
  font-size: 0.8rem;
  background-color: rgba(0, 0, 0, 0.3);
  padding: 5px;
  border-radius: 3px;
}

.item-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 15px;
}

.price {
  color: var(--accent-color);
  font-weight: bold;
}

.special-offer {
  margin-top: 40px;
  background-color: var(--secondary-color);
  padding: 20px;
  border-radius: 5px;
  position: relative;
  overflow: hidden;
}

.offer-badge {
  position: absolute;
  top: 0;
  right: 0;
  background-color: var(--accent-color);
  color: #1a1a1a;
  padding: 3px 10px;
  font-size: 0.8rem;
  font-weight: bold;
  border-bottom-left-radius: 5px;
}

.offer-price {
  margin: 15px 0;
}

.original-price {
  text-decoration: line-through;
  color: var(--text-secondary);
  margin-right: 10px;
}

.discounted-price {
  color: var(--accent-color);
  font-weight: bold;
  font-size: 1.2rem;
}

/* Confetti animation */
@keyframes confetti-fall {
  0% {
    transform: translateY(-100vh) rotate(0deg);
  }
  100% {
    transform: translateY(100vh) rotate(360deg);
  }
}

.confetti {
  position: absolute;
  animation: confetti-fall linear forwards;
}

/* Hint popup */
.hint-popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.hint-content {
  background-color: var(--secondary-color);
  padding: 20px;
  border-radius: 5px;
  max-width: 500px;
  width: 90%;
  position: relative;
  border-top: 5px solid var(--accent-color);
}

.hint-content h3 {
  color: var(--accent-color);
  margin-bottom: 10px;
}

.hints-remaining {
  margin: 10px 0;
  font-size: 0.9rem;
  color: var(--text-secondary);
}

.close-hint {
  background-color: var(--accent-color);
  color: #1a1a1a;
  border: none;
  padding: 8px 15px;
  border-radius: 3px;
  cursor: pointer;
  margin-top: 10px;
}

/* Daily challenge */
.daily-challenge {
  background-color: var(--secondary-color);
  padding: 20px;
  border-radius: 5px;
  margin-top: 30px;
}

.daily-challenge h3 {
  color: var(--accent-color);
  margin-bottom: 15px;
  border-bottom: 1px solid #444;
  padding-bottom: 5px;
}

.challenge-card {
  background-color: #333;
  padding: 15px;
  border-radius: 5px;
  position: relative;
}

.play-btn {
  margin-top: 10px;
}

/* Responsive adjustments */
@media (max-width: 768px) {
  header .container {
    flex-direction: column;
    height: auto;
    padding: 10px;
  }
  
  .header-left {
    width: 100%;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  
  header nav ul {
    margin-top: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  
  .profile-header {
    flex-direction: column;
    text-align: center;
  }
  
  .stats-summary {
    justify-content: center;
  }
}
    </style>
</head>
<body>
  <div id="preloader"></div>
    <header>
        <div class="container">
            <div class="header-left">
                <a href="/courses.html" class="back-btn">Back to Edumate</a>
                <h1><a href="{{ url_for('cb_index') }}">Code Blocks Puzzle</a></h1>
            </div>
            <nav>
                <ul>
                    <li><a href="{{ url_for('cb_index') }}">Levels</a></li>
                    <li><a href="{{ url_for('profile') }}">Profile</a></li>
                    <li><a href="{{ url_for('store') }}">Store</a></li>
                    <li class="coins">🪙 {{ user_data.coins }}</li>
                    <li class="choose_language">
                        <form method="get" action="{{ url_for('cb_index') }}">
                            <select 
                                name="language" 
                                onchange="this.form.submit()" 
                                style="
                                    appearance: none;
                                    -webkit-appearance: none;
                                    -moz-appearance: none;
                                    background-color: #12122b;
                                    color: #e8e8e8;
                                    border: 2px solid #00f2fe;
                                    border-radius: 8px;
                                    padding: 8px 30px 8px 15px;
                                    font-family: 'Poppins', sans-serif;
                                    font-size: 0.9rem;
                                    font-weight: 600;
                                    cursor: pointer;
                                    transition: all 0.3s ease;
                                    box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
                                    background-image: 
                                        linear-gradient(45deg, transparent 50%, #00f2fe 50%),
                                        linear-gradient(135deg, #00f2fe 50%, transparent 50%);
                                    background-position:
                                        calc(100% - 15px) 50%,
                                        calc(100% - 10px) 50%;
                                    background-size:
                                        5px 5px,
                                        5px 5px;
                                    background-repeat: no-repeat;
                                "
                            >
                                <option disabled selected style="background-color: #12122b; color: #b3b3b3; font-weight: 600;">Programming Languages</option>
                                <option value="python" style="background-color: #12122b; color: #e8e8e8; font-weight: 600;">Python</option>
                                <option value="java" style="background-color: #12122b; color: #e8e8e8; font-weight: 600;">Java</option>
                                <option value="C++" style="background-color: #12122b; color: #e8e8e8; font-weight: 600;">C++</option>
                                <option value="C" style="background-color: #12122b; color: #e8e8e8; font-weight: 600;">C</option>
                            </select>
                        </form>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <div class="container">
            <p>Learn programming concepts by arranging code blocks!</p>
        </div>
    </footer>
    
    <script src="{{ url_for('static', filename='js/game.js') }}">
    </script>
</body>
</html>
